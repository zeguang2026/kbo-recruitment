// 状态
let currentGMV = 'all';
let currentCat = 'all';
let searchText = '';
let displayCount = 30;
let selectedBuyers = new Set();

const GMV_LABELS = {
  '10-50w': '🥈 10-50万',
  '50-100w': '🥇 50-100万',
  '100-500w': '💎 100-500万',
  '500-1000w': '👑 500-1000万',
  '1000w+': '🏆 1000万+'
};
const GMV_COLORS = {
  '10-50w': '#6366f1',
  '50-100w': '#0ea5e9',
  '100-500w': '#f59e0b',
  '500-1000w': '#ef4444',
  '1000w+': '#8b5cf6'
};

function getFiltered() {
  return RAW_DATA.filter(b => {
    if (currentGMV !== 'all' && b.max_gmv !== currentGMV) return false;
    if (currentCat !== 'all' && !b.cats.includes(currentCat)) return false;
    if (searchText && !b.name.includes(searchText)) return false;
    return true;
  });
}

function renderCards() {
  const filtered = getFiltered();
  const list = document.getElementById('cardList');
  const noResult = document.getElementById('noResult');
  const loadMoreDiv = document.getElementById('loadMoreDiv');
  const statBar = document.getElementById('statBar');

  const shown = filtered.slice(0, displayCount);
  statBar.textContent = `共 ${filtered.length} 位买手${currentGMV !== 'all' ? '（已筛选）' : ''}`;

  if (filtered.length === 0) {
    list.innerHTML = '';
    noResult.style.display = 'block';
    loadMoreDiv.style.display = 'none';
    return;
  }
  noResult.style.display = 'none';

  list.innerHTML = shown.map(b => {
    const isSelected = selectedBuyers.has(b.name);
    const catText = b.cats.filter(c => c !== 'UNKNOWN').join(' · ') || '综合';
    const color = GMV_COLORS[b.max_gmv] || '#999';
    return `<div class="card ${isSelected ? 'selected' : ''}" onclick="toggleSelect('${b.name.replace(/'/g,"\'")}')">
      <div class="card-check">✓</div>
      <div class="card-gmv" style="background:${color}15;color:${color}">${GMV_LABELS[b.max_gmv] || b.max_gmv}</div>
      <div class="card-name">${b.name}</div>
      <div class="card-cat">${catText}</div>
      <div class="card-sessions">📅 ${b.sessions}场排期</div>
    </div>`;
  }).join('');

  loadMoreDiv.style.display = displayCount < filtered.length ? 'block' : 'none';
}

function loadMore() {
  displayCount += 30;
  renderCards();
}

function filterGMV(val, btn) {
  currentGMV = val;
  displayCount = 30;
  document.querySelectorAll('#gmvFilter .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function filterCat(val, btn) {
  currentCat = val;
  displayCount = 30;
  document.querySelectorAll('#catFilter .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function searchBuyer(val) {
  searchText = val.trim();
  displayCount = 30;
  renderCards();
}

function toggleSelect(name) {
  if (selectedBuyers.has(name)) {
    selectedBuyers.delete(name);
  } else {
    selectedBuyers.add(name);
  }
  document.getElementById('selectedCount').textContent = selectedBuyers.size;
  document.getElementById('applyBtn').disabled = selectedBuyers.size === 0;
  renderCards();
}

function openModal() {
  if (selectedBuyers.size === 0) return;
  const tags = document.getElementById('selectedTags');
  tags.innerHTML = [...selectedBuyers].map(n => `<span class="selected-tag">✓ ${n}</span>`).join('');
  document.getElementById('hiddenBuyers').value = [...selectedBuyers].join('、');
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function closeModalCheck(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// 表单提交 - 发邮件
document.getElementById('applyForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const form = e.target;
  const data = new FormData(form);
  
  // 用 FormSubmit 发送到邮箱
  fetch('https://formsubmit.co/ajax/lichuansong@xiaohongshu.com', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      _subject: '【K播招商提报】' + data.get('shop_name'),
      意向买手: data.get('buyers'),
      店铺名称: data.get('shop_name'),
      店铺链接: data.get('shop_url'),
      联系方式: data.get('contact'),
      货盘介绍: data.get('goods_intro'),
      历史直播: data.get('live_history') || '未填写',
      补充说明: data.get('notes') || '无',
    })
  }).then(r => r.json()).then(r => {
    document.getElementById('formContent').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  }).catch(() => {
    alert('提交成功！运营团队将尽快联系您。');
    closeModal();
  });
});

// 初始化
renderCards();
